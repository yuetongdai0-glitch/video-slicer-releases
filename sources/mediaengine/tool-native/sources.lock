# 格式：name|version|license|sha256|url
# FFmpeg 另有官方 .asc 签名：主机装有 gpg 时脚本会导入 https://ffmpeg.org/ffmpeg-devel.asc，
# 核对公钥指纹 FCF986EA15E6E293A5644F10B4322F04D67658D8 后验签；当前开发主机未安装 gpg，
# 因此本锁文件生成时只做了 SHA-256 校验，签名校验留给装有 gpg 的 CI。
# 更新版本时：改 version/url，删除 native-build/downloads 中的旧包，下载新包后用 shasum -a 256 重新填写 sha256。
